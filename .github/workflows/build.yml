name: Build AiTV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug assembleRelease

      - name: Find APK files
        id: find_apk
        run: |
          find app/build/outputs -name "*.apk" -type f
          DEBUG_APK=$(find app/build/outputs -name "*debug*.apk" -type f | head -1)
          RELEASE_APK=$(find app/build/outputs -name "*release*.apk" -type f | head -1)
          echo "debug_apk=$DEBUG_APK" >> $GITHUB_OUTPUT
          echo "release_apk=$RELEASE_APK" >> $GITHUB_OUTPUT
          echo "Found debug: $DEBUG_APK"
          echo "Found release: $RELEASE_APK"

      - name: Generate version tag
        id: version
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AiTV ${{ steps.version.outputs.tag }}"
          body: |
            App AiTV - Streaming com extensoes CloudStream3.
            Baseado no CloudStream3 com 10 extensoes brasileiras pre-instaladas.
          files: |
            ${{ steps.find_apk.outputs.debug_apk }}
            ${{ steps.find_apk.outputs.release_apk }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
